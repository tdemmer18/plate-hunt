<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#123a66"/><stop offset=".55" stop-color="#071a33"/><stop offset="1" stop-color="#030914"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38d8ff"/><stop offset="1" stop-color="#ff52b4"/>
    </linearGradient>
    <linearGradient id="neonH" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="724" y2="0"><stop offset="0" stop-color="#38d8ff"/><stop offset="1" stop-color="#ff52b4"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38d8ff" stop-opacity="0"/><stop offset="1" stop-color="#38d8ff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="plateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a4d"/><stop offset="1" stop-color="#081a33"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#38d8ff" stroke-opacity=".08" stroke-width="2"/></pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <!-- radar rings -->
  <g fill="none" stroke="#38d8ff">
    <circle cx="512" cy="512" r="410" stroke-opacity=".18" stroke-width="3"/>
    <circle cx="512" cy="512" r="320" stroke-opacity=".22" stroke-width="3"/>
    <circle cx="512" cy="512" r="230" stroke-opacity=".16" stroke-width="3"/>
    <path d="M512 92V932M92 512H932" stroke-opacity=".12" stroke-width="3"/>
  </g>
  <!-- radar sweep wedge -->
  <path d="M512 512 L512 102 A410 410 0 0 1 867 307 Z" fill="url(#sweep)" opacity=".55"/>
  <!-- glow behind plate -->
  <rect x="222" y="352" width="580" height="320" rx="64" fill="#38d8ff" opacity=".35" filter="url(#soft)"/>
  <!-- plate -->
  <g filter="url(#glow)">
    <rect x="232" y="362" width="560" height="300" rx="56" fill="url(#plateFill)" stroke="url(#neon)" stroke-width="18"/>
  </g>
  <rect x="262" y="392" width="500" height="240" rx="34" fill="none" stroke="#38d8ff" stroke-opacity=".35" stroke-width="4"/>
  <circle cx="372" cy="414" r="11" fill="#38d8ff" opacity=".8"/><circle cx="652" cy="414" r="11" fill="#38d8ff" opacity=".8"/>
  <!-- check mark -->
  <path d="M390 520 L475 600 L640 440" fill="none" stroke="url(#neon)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- blip on the radar -->
  <circle cx="770" cy="250" r="16" fill="#3df2a6" filter="url(#glow)"/>
  <circle cx="770" cy="250" r="34" fill="none" stroke="#3df2a6" stroke-opacity=".5" stroke-width="4"/>
  <!-- route line under the plate -->
  <path d="M300 760 H724" stroke="url(#neonH)" stroke-width="14" stroke-linecap="round" opacity=".9"/>
  <path d="M300 760 H724" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 34" opacity=".7"/>
</svg>
